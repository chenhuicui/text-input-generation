# com.peerspace.app.yaml

app_name: "OPenTable"

delay_detect:
    - "Home"
    - "Saved"

navigation_steps:
  - action: click
    target: Saved
    by: text
    retry: 3

verify_action:
  - action: click
    target: Continue
    by: text
    retry: 3

verify_disappear:
  targets:
    - "Enter your phone number"
  by: text

