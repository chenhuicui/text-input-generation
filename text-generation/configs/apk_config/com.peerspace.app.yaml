# com.peerspace.app.yaml

app_name: "Peerspace"

delay_detect:
  - "Photo Shoot"
  - 'Bookings'

navigation_steps:
  - action: click
    target: Account
    by: text
    retry: 3

  - action: click
    type: coordinate
    raw_x_hex: "000075e5"
    raw_y_hex: "00000a09"

verify_action:
  - action: click
    target: Save
    by: text
    retry: 3

verify_appear:
  targets:
    - "Log Out"
    - "Notifications"
  by: text
  timeout: 3

verify_disappear:
  targets:
    - "chenhuicui97@gmail.com"
    - "Edit Photo"
  by: text
  timeout: 3