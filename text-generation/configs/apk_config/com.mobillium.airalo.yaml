# com.peerspace.app.yaml

app_name: "Airalo"

delay_detect:
    - "Search data packs for 200+ countries and regions"

navigation_steps:
  - action: click
    target: "Search data packs for 200+ countries and regions"
    by: text
    retry: 3

verify_action:
  - action: click
    type: coordinate
    raw_x_hex: "000026ff"
    raw_y_hex: "00001c0e"

verify_disappear:
  targets:
    - "CANCEL"
  by: text

verify_appear:
  targets:
    - "Free Welcome eSIM"
    - "BUY NOW"
  by: text
  mode: any
