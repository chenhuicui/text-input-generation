# com.peerspace.app.yaml

app_name: "Paladin"

delay_detect:
    - "Stories"

navigation_steps:
  - action: click
    type: coordinate
    raw_x_hex: "00001b4c"
    raw_y_hex: "00007a92"

  - action: click
    type: coordinate
    raw_x_hex: "000077ff"
    raw_y_hex: "00000cba"

  - action: click
    target: Personal Information
    by: text
    retry: 3

  - action: click
    target: Email
    by: text
    retry: 3

verify_action:
  - action: click
    target: SAVE
    by: text
    retry: 3

verify_disappear:
  targets:
    - "Edit Email"
  by: text
  timeout: 5

verify_appear:
  targets:
    - "Personal Information"
  by: text
  timeout: 5